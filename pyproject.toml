[project]
name = "mcp-financial-analyst"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "azure-ai-projects>=2.10.0",
    "azure-identity>=1.27.0",
    "mcp[cli]>=2,<3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
mcp-financial-analyst = "mcp_financial_analyst:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]
